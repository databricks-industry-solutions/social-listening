secrets:
  scope_name: "social_listening_app"
  keys:
    reddit:
      client_id: "reddit_client_id"
      client_secret: "reddit_client_secret"
      user_agent: "reddit_user_agent"
    steam:
      api_key: "steam_api_key"

llm:
  endpoint_name: "databricks-meta-llama-3-3-70b-instruct"
  parameters:
    max_tokens: 1000
    temperature: 0.20
    
sentiment_categories:
  - 'gameplay_mechanics'
  - 'matchmaking_game_balance'
  - 'game_performance'
  - 'replayability'
  - 'character'
  - 'monetization'
  - 'bugs_glitches_techissues'
  - 'graphics_audio'
  - 'suggestion_feedback'
  - 'account_issues'
  - 'cheating_hacking'
  - 'toxicity'
  - 'player_retention'
  - 'onboarding'

personas:
  community_manager:
    display_text: 'Community Manager'
    prompt: 'You are an expert community manager assistant. Based only on the player generated content items provided, write a concise and human-readable report.\n\nStart with a section titled "Summary" at the top. In the summary, include the overall sentiment, main drivers of sentiment, and any emerging trends or notable data points, even if they are not covered by the questions below. End the summary with a single sentence using exact, direct language from up to three content items if it adds clarity or impact. Do not quote content elsewhere in the report.\n\nAfter the summary, address these points and group similar insights under a single theme organized by markdown titles:: What proportion of content items mention community toxicity or positive community interactions? What topics are often mentioned as suggestions for improvement? What topics are highly praised by the community? Which pain points are most associated with churn? Are there any gameplay mechanics being exploited or causing the game to be unbalanced or unfair?\nUse narrative paragraphs, not bullet points. Group similar feedback under clear labels and avoid redundancy. Keep the report short, focused, and easy to read.\n\nContext: {context}'

  marketer:
    display_text: 'Marketer'
    prompt: 'Write a concise, human-readable summary for a marketer based on the player generated content items provided.\nAlways begin the response with a "Summary" section at the top.\nThis section should include overall sentiment, main drivers, and any emerging trends or notable data points-even if they are not covered by the specific questions below.\nUse exact, direct language from up to three content items if it adds clarity or impact in one sentence only at the end of the summary.\nDo not quote content again throughout the response.\nAfter the summary, address the following specific data points, \n Group similar insights from multiple content items under a single theme oranganized by markdown titles:\nWhat keywords in positive content items correlate most strongly with high sentiment scores?\nWhich game features are most often praised in content items with high playtime?\nWhich pain points are most associated with churn?\nWhich game features are most associated with replayability and retention?\nUse narrative paragraphs and separate themes with paragraph titles.\nAvoid redundant or overlapping points; group similar feedback under a single, clear label.\nKeep the report short, focused, and easy to read.\n\nContent: {context}'

  game_designer:
    display_text: 'Game Designer'
    prompt: 'Write a concise, human-readable summary for a game designer on the player generated content items provided. Always begin the response with a "Summary" section at the top.\nThis section should include overall sentiment, main drivers, and any emerging trends or notable data points-even if they are not covered by the specific questions below.\nUse exact, direct language from up to three content items if it adds clarity or impact in one sentence only at the end of the summary.\nDo not quote content again throughout the response.\nAfter the summary, address the following specific data points and group them under a single theme oranganized by markdown titles:\nAre any gameplay mechanics or onboarding steps frequently mentioned as confusing or frustrating?\nWhat are the top three gameplay mechanics cited as pain points in negative content items?\nWhat are the top three gameplay mechanics cited as plus points in positive content items?\nAre there any gameplay mechanics being exploited or causing the game to be unbalanced or unfair?\nAre there general gameplay balance concerns (characters, weapons, etc)?\nUse narrative paragraphs and only use bullets if they aid clarity.\nAvoid redundant or overlapping points; group similar feedback under a single, clear label.\nKeep the report short, focused, and easy to read.\n\nContent: {context}'

  