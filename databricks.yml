bundle:
  name: games_social_listening
  uuid: b49905e1-a9e6-423c-a468-3ff7f05036f1

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  project_name:
    default: games-social-listening-demo

  # Environment variable used for CICD deployment paths
  environment:
    description: "Deployment environment (dev, staging, prod, demo)"
    default: "demo"

  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: warehouse for reporting
  prefix:
    # Lowercase letters, numbers, and dashes only
    description: prefix for all asset display names

targets:
  demo:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    # By default, variables will be populated from CLI arguments in initial run, but can be populated here for long term use
    #variables:
    #  catalog: demo
    #  schema: player_feedback
    #  warehouse_id: WAREHOUSEID
    #  prefix: current_user

  # E.g. for CICD deployment
  dev:
    mode: development

    variables:
      catalog: cmegdemos_catalog
      schema: cicd_social_listening
      warehouse_id: ""
      prefix: dev-cicd